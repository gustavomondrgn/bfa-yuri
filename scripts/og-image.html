<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>og-bfa-grupo</title>
<!--
  Molde da imagem de compartilhamento (og:image, 1200×630) de /bfa-grupo.
  Gerada por `npm run og` -> site/assets/og-bfa-grupo.png.
  Usa só textos já presentes na página.
-->
<style>
  html, body { margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", ui-sans-serif, system-ui, -apple-system, Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(1100px 380px at 50% -170px, rgba(163, 23, 27, .11), rgba(163, 23, 27, 0) 72%),
      #FFFFFF;
    position: relative;
    text-align: center;
  }
  body::before {
    content: "";
    position: absolute;
    inset: 0 0 auto;
    height: 8px;
    background: linear-gradient(90deg, #6E0E12, #A3171B 42%, #0E5A6B);
  }
  .brand {
    margin: 0 0 26px;
    font-size: 30px;
    font-weight: 600;
    letter-spacing: .01em;
    color: #616161;
  }
  h1 {
    margin: 0;
    font-size: 112px;
    font-weight: 750;
    line-height: .98;
    letter-spacing: -.035em;
    color: #181818;
  }
  .highlight {
    margin: 34px 0 0;
    font-size: 42px;
    font-weight: 650;
    letter-spacing: -.01em;
    color: #A3171B;
  }
</style>
</head>
<body>
  <div>
    <p class="brand">Yuri dos Anjos</p>
    <h1>Black Friday<br>Apocalíptica</h1>
    <p class="highlight">Ofertas com até 80% de desconto.</p>
  </div>
</body>
</html>
