# yuridosanjos.com.br/bfa — ofertas da Black Friday Apocalíptica.
# Responde com e sem o stripprefix do Coolify. /bfa-grupo NÃO é deste app.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml;
    sendfile on;
    tcp_nopush on;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # página: sem redirect (preserva UTMs) e sem cache
    location = /bfa          { expires -1; try_files /bfa/index.html =404; }
    location = /bfa/         { expires -1; try_files /bfa/index.html =404; }
    location = /bfa/index.html { expires -1; try_files $uri =404; }

    # preços, fases e vagas: sempre do servidor
    location = /bfa/ofertas.json {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /bfa/ { expires 10m; try_files $uri =404; }

    # arranjo com stripprefix
    location = /           { expires -1; try_files /bfa/index.html =404; }
    location = /index.html { expires -1; try_files /bfa/index.html =404; }
    location = /ofertas.json {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /bfa/ofertas.json =404;
    }

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location / { expires 10m; try_files /bfa$uri =404; }
}
