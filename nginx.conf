# =============================================================================
#  yuridosanjos.com.br/bfa-grupo — página ponte da Black Friday Apocalíptica
#
#  O site vive em /usr/share/nginx/html/bfa-grupo/ e responde nos dois
#  arranjos possíveis do Traefik do Coolify:
#
#    - SEM stripprefix (padrão do /guias e do /pqaf): o container recebe
#      /bfa-grupo, /bfa-grupo/app.js, /bfa-grupo/assets/...
#    - COM stripprefix (se o Coolify regenerar os labels): o container recebe
#      /, /app.js, /assets/...
#
#  Assim a página não cai em 404 se os labels mudarem no meio da campanha.
#  /bfa (ofertas do dia 16) NÃO é deste app.
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    charset utf-8;
    charset_types text/css application/javascript image/svg+xml;

    sendfile on;
    tcp_nopush on;
    server_tokens off;

    # atrás do Traefik o nginx enxerga http; sem isso emitiria redirects
    # absolutos em http:// e tiraria o visitante do HTTPS
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml;

    # Cache-Control vem de `expires` (e não de add_header) para que os headers
    # abaixo valham em todas as locations sem precisar repetir.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ----------------------------------------------------------- a página --
    # /bfa-grupo é o endereço divulgado: serve direto, sem redirect, para não
    # gastar um salto no navegador do Instagram nem perder as UTMs.
    location = /bfa-grupo {
        expires -1;
        try_files /bfa-grupo/index.html =404;
    }

    location = /bfa-grupo/ {
        expires -1;
        try_files /bfa-grupo/index.html =404;
    }

    location = /bfa-grupo/index.html {
        expires -1;
        try_files $uri =404;
    }

    # ------------------------------------------------------------- arquivos --
    # app.js, favicon e imagem de compartilhamento; cada um leva ?v= no HTML
    location /bfa-grupo/ {
        expires 10m;
        try_files $uri =404;
    }

    # ------------------------------------------------- arranjo com stripprefix --
    location = / {
        expires -1;
        try_files /bfa-grupo/index.html =404;
    }

    location = /index.html {
        expires -1;
        try_files /bfa-grupo/index.html =404;
    }

    # ------------------------------------------------------------ health check --
    # interno do container (o Traefik não roteia /healthz para cá)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        expires 10m;
        try_files /bfa-grupo$uri =404;
    }
}
